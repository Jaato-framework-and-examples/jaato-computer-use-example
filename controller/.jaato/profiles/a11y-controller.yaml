name: a11y-controller
description: >-
  LLM controller for the jaato-a11y-bridge device. A vision model grounds over a
  set-of-marks screenshot + pruned node tree and drives the device through
  client-provided screen.* host tools. All grounding/settle/recovery policy is
  daemon-side (this controller); the device is a dumb mechanism (01-PROTOCOL.md).
provider: openrouter
model: google/gemini-2.5-flash

plugin_configs:
  openrouter:
    # Resolved daemon-side from the user's pass store — never a literal key here.
    api_key: pass://jaato/openrouter/api-key
    api_params:
      # Nonzero to avoid greedy repetition loops on unstable screens.
      temperature: 0.6
      # Per-turn output cap — a driving turn is a short line + one tool call
      # (measured model output ~30 tokens/turn).
      max_tokens: 1024
      # gemini-2.5-flash chosen for LOW LATENCY. Evidence: the slow turns were NOT
      # payload — measured context ~3.7k tokens, images pruned to the latest only,
      # model output ~30 tok/turn — so the cost was provider ROUND-TRIP time. Flash
      # targets fast TTFT + is cheap (~8x under gpt-4o) and vision+tools capable.
      # It does NOT support parallel_tool_calls (batching); our stack showed vision
      # models won't batch observe-dependent sequences anyway, so that param is
      # omitted. The controller's act-lock stays a harmless one-action invariant.

# The agent's only tools are the client-provided screen.* host tools
# (register_client_tools). No runner-tier tool plugins are needed — and omitting
# cli/file_edit/etc. keeps the device agent's authority scoped to the screen.
plugins: []
