name: a11y-controller
description: >-
  LLM controller for the jaato-a11y-bridge device. A vision model grounds over a
  set-of-marks screenshot + pruned node tree and drives the device through
  client-provided screen.* host tools. All grounding/settle/recovery policy is
  daemon-side (this controller); the device is a dumb mechanism (01-PROTOCOL.md).
provider: doubleword
# Open-weights vision model on doubleword (consistent set-of-marks grounding).
# On the 235B after the 30B-A3B (~8x smaller, "flash-class") degenerated on web
# tasks: even WITH frequency/presence penalties it looped the same sentence
# verbatim within a completion and never emitted the tool call (narrate-without-
# acting) — device browser-click was solid, the model was the wall. 235B is far
# less degeneration-prone (slower per turn). Drop back to
# Qwen/Qwen3-VL-30B-A3B-Instruct-FP8 for the faster variant if it stops looping.
model: Qwen/Qwen3-VL-235B-A22B-Instruct-FP8

plugin_configs:
  doubleword:
    # Resolved daemon-side from the user's pass store — never a literal key here.
    api_key: pass://jaato/doubleword/api-key
    # doubleword's /v1/models doesn't report a context length and the provider
    # refuses to guess (no-fallback rule), so pin the model's native 256K.
    context_length: 262144
    api_params:
      # Nonzero to avoid greedy repetition loops; a bit higher (0.6) since 0.4
      # still degenerated on unstable screens. Ref selection stays stable enough.
      temperature: 0.6
      # Anti-repetition. The 30B degenerates by regenerating the SAME sentence
      # within one completion (e.g. "I'll click the date…" ~10x) until max_tokens,
      # never emitting the tool call — the dominant web-task failure once the
      # device browser-click was fixed. frequency_penalty penalizes tokens by
      # their in-completion count (the direct lever for verbatim repetition);
      # presence_penalty adds a mild diversity nudge. Moderate values so legit
      # repeats (refs, coords, "screen_tap") aren't over-penalized. Tune up if it
      # still loops, or swap to the less-degenerate 235B.
      frequency_penalty: 0.5
      presence_penalty: 0.3
      # Hard cap on per-turn output. A driving turn is short reasoning + one
      # screen.* tool call, but an open-ended PLANNING turn can legitimately need
      # more prose before it acts — 1024 truncated mid-plan (the booking task).
      # 2048 gives that headroom while still bounding a degenerating model that
      # would otherwise run away indefinitely (unbounded repetition, ~1 min of
      # output at this cap). An abnormal max_tokens finish is now surfaced to the
      # operator (controller run loop + framework), not a silent "[turn done]".
      max_tokens: 2048
      # Realtime tier — interactive device driving can't tolerate flex's async
      # (minutes-level) latency; every turn is on the operator's critical path.
      service_tier: priority

# The agent's only tools are the client-provided screen.* host tools
# (register_client_tools). No runner-tier tool plugins are needed — and omitting
# cli/file_edit/etc. keeps the device agent's authority scoped to the screen.
plugins: []
